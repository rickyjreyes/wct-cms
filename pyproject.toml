[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-wct-validation"
version = "0.1.0"
description = "Blind CMS NanoAOD cross-validation of a pre-specified WCT residual signature"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Richard J. Reyes"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "uproot>=5.0",
  "awkward>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cms-wct = "cms_wct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
